<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Beauty Cosmetics</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <section class="login-container">

        <div class="container-fluid">

            <div class="row g-0 vh-100">

                <!--=====================================
                        PANEL IZQUIERDO
                ======================================-->

                <div class="col-lg-5 d-none d-lg-block">

                    <div class="login-banner">

                        <img
                            src="img/login-banner.jpg"
                            alt="Beauty Cosmetics">

                        <div class="banner-overlay">

                            <div class="banner-content">

                                <h1>

                                    Beauty
                                    <span>Cosmetics</span>

                                </h1>

                                <h2>

                                    Descubre una nueva forma de cuidar tu belleza.

                                </h2>

                                <p>

                                    Maquillaje, skincare y fragancias premium
                                    para resaltar tu estilo.

                                </p>

                            </div>

                        </div>

                    </div>

                </div>

                <!--=====================================
                        PANEL DERECHO
                ======================================-->

                <div class="col-lg-7">

                    <div class="login-content">

                        <div class="login-card">

                            <div class="text-center mb-5">

                                <h2>

                                    ¡Bienvenido de nuevo!

                                </h2>

                                <p>

                                    Inicia sesión para continuar comprando.

                                </p>

                            </div>

                            <form>

                                <!--========================
                                        CORREO
                                ========================-->

                                <div class="mb-4">

                                    <label class="form-label">

                                        Correo electrónico

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="bi bi-envelope"></i>

                                        </span>

                                        <input
                                            type="email"
                                            class="form-control"
                                            placeholder="correo@ejemplo.com">

                                    </div>

                                </div>

                                <!--========================
                                CONTRASEÑA
                                =========================-->

                                <div class="mb-3">

                                    <label class="form-label">

                                        Contraseña

                                    </label>

                                    <div class="input-group">

                                        <span class="input-group-text">

                                            <i class="bi bi-lock"></i>

                                        </span>

                                        <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        placeholder="Ingresa tu contraseña">

                                        <button
                                        class="btn btn-outline-secondary"
                                        type="button" 
                                        id="togglePassword">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!--========================
                                      OPCIONES
                            =========================-->


                            <div class="d-flex justify-content-between align-items-center mb-4">

                                <div class="form-check">
       
                                    <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                    <label
                                    class="form-check-label"
                                    for="remember">
            
                                    Recordarme

                                </label>
    
                            </div>

                            <a href="#" class="forgot-link">
        
                                ¿Olvidaste tu contraseña?

                            </a>

                        </div>


                        <!--========================
                                BOTÓN LOGIN
                        =========================-->


                        <div class="d-grid mb-4">

                            <button
                            type="submit"
                            class="btn btn-login">

                            Iniciar Sesión

                        </button>

                    </div>


                    <!--========================
                             SEPARADOR
                    =========================-->


                    <div class="separator">

                        <span>

                            o continúa con

                        </span>

                    </div>


                    <!--========================
                            LOGIN SOCIAL
                    =========================-->

                    <div class="social-login">

                        <a href="#" class="google">

                            <i class="bi bi-google"></i>

                            Google
   
                        </a>

                        <a href="#" class="facebook">

                            <i class="bi bi-facebook"></i>

                            Facebook

                        </a>

                    </div>


                    <!--========================
                             REGISTRO
                    =========================-->

                    <div class="register-link">

                        ¿Aún no tienes una cuenta?

                        <a href="registro.html">

                            Crear una cuenta

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</div>

</section>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>

<!-- JavaScript -->

<script src="js/login.js"></script>

</body>

</html>
